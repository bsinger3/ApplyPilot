# ApplyPilot search configuration for Software Project Management.

queries:
  - query: "software project manager"
    tier: 1
  - query: "technical project manager"
    tier: 1
  - query: "IT project manager"
    tier: 1
  - query: "implementation project manager"
    tier: 1
  - query: "software delivery manager"
    tier: 2
  - query: "agile project manager"
    tier: 2
  - query: "scrum master project manager"
    tier: 2
  - query: "program manager software"
    tier: 2
  - query: "technical program manager"
    tier: 2
  - query: "project manager SaaS"
    tier: 3
  - query: "project manager cloud"
    tier: 3
  - query: "digital project manager"
    tier: 3

locations:
  - location: "Remote"
    remote: true
  - location: "New York, NY"
    remote: false

location:
  accept_patterns:
    - "Remote"
    - "Anywhere"
    - "United States"
    - "US"
    - "USA"
    - "New York"
    - "NYC"
    - "New York City"
  reject_patterns:
    - "onsite only"
    - "clearance required"
    - "TS/SCI"
    - "India"
    - "Philippines"
    - "London, UK"

country: "USA"

boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

defaults:
  results_per_site: 50
  hours_old: 72

exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
